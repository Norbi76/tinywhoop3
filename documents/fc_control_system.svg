<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 850" width="1290" height="850" class="dg" role="img" aria-label="Control system of the tiny-whoop flight controller. Panel A: the roll and pitch cascade, with a 50 Hz velocity loop feeding a 250 Hz angle loop feeding a 1000 Hz rate loop, then the mixer, four PWM motors and the airframe, with three feedback paths returning through the IMU, the attitude estimator and the nav estimator. Panel B: the yaw chain, which has a rate loop only because there is no magnetometer, and the altitude chain, which adds its PID output to a fixed hover throttle and is bypassed whenever altitude is invalid."><title>Flight controller control system</title><desc>Control system of the tiny-whoop flight controller. Panel A: the roll and pitch cascade, with a 50 Hz velocity loop feeding a 250 Hz angle loop feeding a 1000 Hz rate loop, then the mixer, four PWM motors and the airframe, with three feedback paths returning through the IMU, the attitude estimator and the nav estimator. Panel B: the yaw chain, which has a rate loop only because there is no magnetometer, and the altitude chain, which adds its PID output to a fixed hover throttle and is bypassed whenever altitude is invalid.</desc><style>
.dg { font-family: 'IBM Plex Sans','IBM Plex Sans Condensed','Segoe UI',Helvetica,Arial,sans-serif; }
.dg text { fill: #171C22; }
.dg .mono { font-family: 'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace; }
.dg .t9 { font-size: 9px; }
.dg .t10 { font-size: 10px; }
.dg .t11 { font-size: 11px; }
.dg .t12 { font-size: 12.5px; }
.dg .t14 { font-size: 14px; }
.dg .b { font-weight: 600; }
.dg .muted { fill: #5C6873; }
.dg .track { letter-spacing: 0.09em; }
.dg .box { fill: #FFFFFF; stroke: #C9D2DA; stroke-width: 1; }
.dg .box2 { fill: #EEF2F5; stroke: #C9D2DA; stroke-width: 1; }
.dg .ghost { fill: none; stroke: #C9D2DA; stroke-width: 1; stroke-dasharray: 4 3; }
.dg .bandO { fill: rgba(15,110,124,0.075); stroke: #0F6E7C; stroke-width: 1; stroke-opacity: 0.35; }
.dg .bandM { fill: rgba(162,98,14,0.075); stroke: #A2620E; stroke-width: 1; stroke-opacity: 0.35; }
.dg .bandI { fill: rgba(190,58,48,0.070); stroke: #BE3A30; stroke-width: 1; stroke-opacity: 0.35; }
.dg .ln { fill: none; stroke: #171C22; stroke-width: 1.4; }
.dg .lnO { fill: none; stroke: #0F6E7C; stroke-width: 1.6; }
.dg .lnM { fill: none; stroke: #A2620E; stroke-width: 1.6; }
.dg .lnI { fill: none; stroke: #BE3A30; stroke-width: 1.6; }
.dg .lnDash { fill: none; stroke: #5C6873; stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .hair { fill: none; stroke: #C9D2DA; stroke-width: 1; }
.dg .fO { fill: #0F6E7C; }
.dg .fM { fill: #A2620E; }
.dg .fI { fill: #BE3A30; }
.dg .fInk { fill: #171C22; }
.dg .sumc { fill: #FFFFFF; stroke: #171C22; stroke-width: 1.4; }
</style><rect x="0" y="0" width="1290" height="850" fill="#FFFFFF"/><defs>
<marker id="aI" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" class="fInk"/></marker>
<marker id="aO" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" class="fO"/></marker>
<marker id="aM" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" class="fM"/></marker>
<marker id="aN" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" class="fI"/></marker>
</defs><text x="24" y="26" class="t14 b mono fI" text-anchor="start">A</text><text x="42" y="26" class="t12 b" text-anchor="start">ROLL AND PITCH — three loops nested inside one 1 kHz tick</text><text x="42" y="42" class="t9 muted" text-anchor="start">Each loop's output is the setpoint of the loop below it. The three run in the same task, on the same tick, phase-locked by divider counters.</text><rect x="186" y="80" width="214" height="84" rx="4" class="bandO"/><rect x="466" y="80" width="214" height="84" rx="4" class="bandM"/><rect x="740" y="80" width="214" height="84" rx="4" class="bandI"/><text x="293" y="72" class="t9 b mono track fO" text-anchor="middle">OUTER · 50 Hz</text><text x="573" y="72" class="t9 b mono track fM" text-anchor="middle">MID · 250 Hz</text><text x="847" y="72" class="t9 b mono track fI" text-anchor="middle">INNER · 1000 Hz</text><rect x="24" y="104" width="146" height="48" rx="4" class="box"/><text x="97.0" y="123.5" class="t9 b mono track muted" text-anchor="middle">PILOT</text><text x="97.0" y="137.5" class="t11 b" text-anchor="middle">roll / pitch stick</text><polyline points="170,128 185,128" class="ln" marker-end="url(#aI)"/><circle cx="200" cy="128" r="13" class="sumc"/><text x="200" y="132.5" class="t12 b" text-anchor="middle">Σ</text><text x="222" y="152" class="t12 b muted" text-anchor="middle">−</text><rect x="226" y="104" width="160" height="48" rx="4" class="box"/><text x="306.0" y="125.5" class="t11 b" text-anchor="middle">PID  VEL X / VEL Y</text><text x="306.0" y="137.5" class="t9 mono muted" text-anchor="middle">out ± 25°  ·  Kp 8 Ki 1.5</text><polyline points="386,128 465,128" class="lnO" marker-end="url(#aO)"/><text x="426" y="108" class="t9 mono fO" text-anchor="middle">angle sp</text><text x="426" y="119" class="t9 mono fO" text-anchor="middle">± 25°</text><circle cx="480" cy="128" r="13" class="sumc"/><text x="480" y="132.5" class="t12 b" text-anchor="middle">Σ</text><text x="502" y="152" class="t12 b muted" text-anchor="middle">−</text><rect x="506" y="104" width="160" height="48" rx="4" class="box"/><text x="586.0" y="125.5" class="t11 b" text-anchor="middle">PID  ANGLE ROLL / PITCH</text><text x="586.0" y="137.5" class="t9 mono muted" text-anchor="middle">out ± 250°/s  ·  Kp 4.5</text><polyline points="666,128 739,128" class="lnM" marker-end="url(#aM)"/><text x="703" y="108" class="t9 mono fM" text-anchor="middle">rate sp</text><text x="703" y="119" class="t9 mono fM" text-anchor="middle">± 250°/s</text><circle cx="754" cy="128" r="13" class="sumc"/><text x="754" y="132.5" class="t12 b" text-anchor="middle">Σ</text><text x="776" y="152" class="t12 b muted" text-anchor="middle">−</text><rect x="780" y="104" width="160" height="48" rx="4" class="box"/><text x="860.0" y="125.5" class="t11 b" text-anchor="middle">PID  RATE ROLL / PITCH</text><text x="860.0" y="137.5" class="t9 mono muted" text-anchor="middle">out ± 0.5  ·  D-LPF 60 Hz</text><polyline points="940,128 968,128" class="lnI" marker-end="url(#aN)"/><rect x="970" y="104" width="100" height="48" rx="4" class="box"/><text x="1020.0" y="125.5" class="t11 b" text-anchor="middle">MIXER</text><text x="1020.0" y="137.5" class="t9 mono muted" text-anchor="middle">X-quad</text><text x="1020" y="168" class="t9 mono muted" text-anchor="middle">scale mix → place throttle → shrink to fit</text><polyline points="1070,128 1086,128" class="ln" marker-end="url(#aI)"/><rect x="1088" y="104" width="96" height="48" rx="4" class="box"/><text x="1136.0" y="125.5" class="t11 b" text-anchor="middle">4 × PWM</text><text x="1136.0" y="137.5" class="t9 mono muted" text-anchor="middle">LEDC 24 kHz</text><polyline points="1184,128 1192,128" class="ln" marker-end="url(#aI)"/><rect x="1194" y="104" width="88" height="48" rx="4" class="box"/><text x="1238.0" y="125.5" class="t11 b" text-anchor="middle">AIRFRAME</text><text x="1238.0" y="137.5" class="t9 mono muted" text-anchor="middle">6 DOF</text><polyline points="1245,152 1245,358" class="hair"/><circle cx="1245" cy="200" r="2.6" class="fInk"/><circle cx="1245" cy="272" r="2.6" class="fInk"/><circle cx="1245" cy="358" r="2.6" class="fInk"/><polyline points="1245,200 1152,200" class="lnI"/><rect x="1002" y="178" width="150" height="44" rx="4" class="box"/><text x="1077.0" y="197.0" class="t10 b" text-anchor="middle">IMU gyro</text><text x="1077.0" y="209.0" class="t9 mono muted" text-anchor="middle">gyro_x / gyro_y, 1 kHz</text><polyline points="1002,200 754,200 754,143" class="lnI" marker-end="url(#aN)"/><text x="760" y="218" class="t9 mono fI" text-anchor="start">measured body rate  ·  deg/s</text><polyline points="1245,272 1206,272" class="lnM"/><rect x="1056" y="250" width="150" height="44" rx="4" class="box"/><text x="1131.0" y="269.0" class="t10 b" text-anchor="middle">IMU accel + gyro</text><text x="1131.0" y="281.0" class="t9 mono muted" text-anchor="middle">±8 g  ·  ±2000°/s</text><polyline points="1056,272 1030,272" class="lnM"/><rect x="826" y="250" width="204" height="44" rx="4" class="box"/><text x="928.0" y="269.0" class="t10 b" text-anchor="middle">ATTITUDE ESTIMATOR</text><text x="928.0" y="281.0" class="t9 mono muted" text-anchor="middle">complementary, τ = 0.5 s</text><polyline points="826,272 480,272 480,143" class="lnM" marker-end="url(#aM)"/><text x="486" y="290" class="t9 mono fM" text-anchor="start">measured roll / pitch angle  ·  deg</text><polyline points="1245,358 1206,358" class="lnO"/><rect x="1040" y="336" width="166" height="44" rx="4" class="box"/><text x="1123.0" y="355.0" class="t10 b" text-anchor="middle">VL53L1X + PMW3901</text><text x="1123.0" y="367.0" class="t9 mono muted" text-anchor="middle">ToF 33 Hz  ·  flow 100 Hz</text><polyline points="1040,358 1014,358" class="lnO"/><rect x="770" y="336" width="244" height="44" rx="4" class="box"/><text x="892.0" y="355.0" class="t10 b" text-anchor="middle">NAV ESTIMATOR</text><text x="892.0" y="367.0" class="t9 mono muted" text-anchor="middle">v = (Δcounts / K) / dt × altitude</text><polyline points="770,358 200,358 200,143" class="lnO" marker-end="url(#aO)"/><text x="206" y="376" class="t9 mono fO" text-anchor="start">measured body velocity  ·  m/s   —   drops out the moment altitude_valid or velocity_valid goes false</text><line x1="24" y1="418" x2="1266" y2="418" class="hair"/><text x="24" y="452" class="t14 b mono fI" text-anchor="start">B</text><text x="42" y="452" class="t12 b" text-anchor="start">YAW AND ALTITUDE — the two chains that break the pattern</text><text x="42" y="468" class="t9 muted" text-anchor="start">The mixer, motors and airframe on the right are the same physical block drawn in panel A; each chain is redrawn so its own loop closes.</text><rect x="186" y="506" width="214" height="84" rx="4" class="bandO"/><rect x="24" y="524" width="146" height="48" rx="4" class="box"/><text x="97.0" y="543.5" class="t9 b mono track muted" text-anchor="middle">PILOT</text><text x="97.0" y="557.5" class="t11 b" text-anchor="middle">throttle stick</text><polyline points="170,548 185,548" class="ln" marker-end="url(#aI)"/><circle cx="200" cy="548" r="13" class="sumc"/><text x="200" y="552.5" class="t12 b" text-anchor="middle">Σ</text><text x="222" y="572" class="t12 b muted" text-anchor="middle">−</text><rect x="226" y="524" width="160" height="48" rx="4" class="box"/><text x="306.0" y="545.5" class="t11 b" text-anchor="middle">PID  ALTITUDE</text><text x="306.0" y="557.5" class="t9 mono muted" text-anchor="middle">50 Hz  ·  out ± 0.25 throttle</text><polyline points="386,548 417,548" class="lnO" marker-end="url(#aO)"/><circle cx="430" cy="548" r="13" class="sumc"/><text x="430" y="552.5" class="t12 b" text-anchor="middle">+</text><text x="408" y="526" class="t9 mono fO" text-anchor="start">+ HOVER_THROTTLE 0.45</text><polyline points="443,548 968,548" class="lnO" marker-end="url(#aO)"/><text x="706" y="538" class="t9 mono fO" text-anchor="middle">throttle_command  0 … 1</text><polyline points="178,548 178,492 600,492 600,540" class="lnDash" marker-end="url(#aI)"/><text x="389" y="486" class="t9 mono muted" text-anchor="middle">hold OFF, or altitude_valid false → the pilot's throttle passes straight through</text><rect x="740" y="646" width="214" height="84" rx="4" class="bandI"/><rect x="566" y="664" width="160" height="48" rx="4" class="box"/><text x="646.0" y="683.5" class="t9 b mono track muted" text-anchor="middle">PILOT</text><text x="646.0" y="697.5" class="t11 b" text-anchor="middle">yaw stick → rate</text><text x="244" y="667" class="t9 muted" text-anchor="start">Yaw has no angle loop. With no magnetometer on the</text><text x="244" y="681" class="t9 muted" text-anchor="start">airframe, absolute heading is not observable, so yaw is</text><text x="244" y="695" class="t9 muted" text-anchor="start">always flown as a rate — the stick commands ± 250°/s</text><text x="244" y="709" class="t9 muted" text-anchor="start">and nothing ever corrects the integrated heading.</text><polyline points="726,688 739,688" class="ln" marker-end="url(#aI)"/><circle cx="754" cy="688" r="13" class="sumc"/><text x="754" y="692.5" class="t12 b" text-anchor="middle">Σ</text><text x="776" y="712" class="t12 b muted" text-anchor="middle">−</text><rect x="780" y="664" width="160" height="48" rx="4" class="box"/><text x="860.0" y="685.5" class="t11 b" text-anchor="middle">PID  RATE YAW</text><text x="860.0" y="697.5" class="t9 mono muted" text-anchor="middle">1000 Hz  ·  out ± 0.5</text><polyline points="940,688 968,688" class="lnI" marker-end="url(#aN)"/><rect x="970" y="524" width="100" height="188" rx="4" class="box"/><text x="1020.0" y="603.5" class="t11 b" text-anchor="middle">MIXER</text><text x="1020.0" y="615.5" class="t9 mono muted" text-anchor="middle">roll · pitch</text><text x="1020.0" y="627.5" class="t9 mono muted" text-anchor="middle">yaw · throttle</text><text x="1020.0" y="639.5" class="t9 mono muted" text-anchor="middle">→ 4 commands</text><polyline points="1070,618 1086,618" class="ln" marker-end="url(#aI)"/><rect x="1088" y="524" width="96" height="188" rx="4" class="box"/><text x="1136.0" y="608.5" class="t11 b mono" text-anchor="middle">M0   M1</text><text x="1136.0" y="622.5" class="t11 b mono" text-anchor="middle">M2   M3</text><text x="1136.0" y="634.5" class="t9 mono muted" text-anchor="middle">LEDC 24 kHz</text><polyline points="1184,618 1192,618" class="ln" marker-end="url(#aI)"/><rect x="1194" y="524" width="88" height="188" rx="4" class="box"/><text x="1238.0" y="615.5" class="t11 b" text-anchor="middle">AIRFRAME</text><text x="1238.0" y="627.5" class="t9 mono muted" text-anchor="middle">6 DOF</text><polyline points="1245,712 1245,800" class="hair"/><circle cx="1245" cy="744" r="2.6" class="fInk"/><circle cx="1245" cy="800" r="2.6" class="fInk"/><polyline points="1245,744 1170,744" class="lnI"/><rect x="1010" y="722" width="160" height="44" rx="4" class="box"/><text x="1090.0" y="741.0" class="t10 b" text-anchor="middle">IMU gyro</text><text x="1090.0" y="753.0" class="t9 mono muted" text-anchor="middle">yaw_rate, integrated only</text><polyline points="1010,744 754,744 754,703" class="lnI" marker-end="url(#aN)"/><polyline points="1245,800 1206,800" class="lnO"/><rect x="1046" y="778" width="160" height="44" rx="4" class="box"/><text x="1126.0" y="797.0" class="t10 b" text-anchor="middle">VL53L1X ToF</text><text x="1126.0" y="809.0" class="t9 mono muted" text-anchor="middle">short mode, 20 ms budget</text><polyline points="1046,800 1020,800" class="lnO"/><rect x="766" y="778" width="254" height="44" rx="4" class="box"/><text x="893.0" y="797.0" class="t10 b" text-anchor="middle">NAV ESTIMATOR</text><text x="893.0" y="809.0" class="t9 mono muted" text-anchor="middle">altitude = range × cosφ · cosθ</text><polyline points="766,800 200,800 200,561" class="lnO" marker-end="url(#aO)"/><text x="206" y="818" class="t9 mono fO" text-anchor="start">measured altitude  ·  m   —   valid only between 0.03 m and 1.30 m and below 40° of tilt</text></svg>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- ===========================================================================
     index.html - the pilot's control dashboard.

     WHAT THIS FILE IS
       The entire user interface for flying the drone: status readouts, the button pads,
       arm/disarm/kill, flight mode, the camera viewfinder and the PID tuning sliders. It is
       ONE self-contained file - HTML, CSS and JS inline, no CDN, no external fonts, no
       external anything - because the drone's SoftAP has no internet connection and any
       external reference would simply hang the page mid-load.

       It is COMPILED INTO THE FIRMWARE via EMBED_FILES in this component's CMakeLists.txt, not
       read from the SD card. So it works with no card fitted and can never go stale relative
       to the firmware it talks to. The cost is that editing it needs a reflash - use
       tools/mock_server.py, which serves this file straight off disk, while iterating.

     HOW IT TALKS TO THE BOARD - three independent timers, deliberately different rates
       every  50 ms (20 Hz)  POST /api/input     held-button state
       every 120 ms (~8 fps) GET  /preview.jpg   viewfinder, only while preview is on
       every 200 ms  (5 Hz)  GET  /api/status    everything displayed
       Everything else is event-driven (arm, mode, capture, gains).

       Input is posted at a FIXED RATE rather than as an event per press. That is what lets the
       firmware run a browser watchdog at all: silence is unambiguous, whereas with edge events
       "no message" and "no change" look identical. Press and release ALSO post immediately, on
       top of the fixed rate - that is a latency optimisation, not a replacement for it: the
       20 Hz heartbeat still carries the same state and the watchdog still only ever looks at
       silence.

       The 20 Hz input POST is NON-OVERLAPPING: a tick is skipped while the previous POST is
       still in flight, and any POST still open after INPUT_TIMEOUT_MS is aborted. Without this
       a degraded link queues POSTs against an ESP-IDF HTTP server that services requests
       SERIALLY on one task, so control latency degrades far worse than the link did. The
       viewfinder has always worked this way (previewBusy); input now does too.

     THE BROWSER-SIDE SAFETY BEHAVIOUR
       releaseAll() is wired to blur, pagehide and visibilitychange, so switching tabs or
       locking the phone releases every button immediately rather than waiting for the
       firmware's 500 ms timeout to notice. stopPreviewIfHidden() does the same for the camera,
       so a backgrounded tab stops pulling frames.

       A SCREEN WAKE LOCK is held for as long as this page is visible. This is not a comfort
       feature. A phone screen blanking on its own idle timer fires visibilitychange, which
       calls releaseAll(); three seconds later control_state's DISARM_TIMEOUT_US drops the arm
       request and the drone stops flying. A steady hover with nobody touching the screen is
       exactly the case that triggers it. The lock is re-requested on every return to visible,
       because the browser drops it whenever the page is hidden.

       THE CONTROL LINK IS MONITORED SEPARATELY FROM THE STATUS LINK. /api/input (20 Hz) and
       /api/status (5 Hz) are different requests; the banner used to reflect only the latter,
       so the path that actually flies the drone could be failing while the page read
       "Ready to arm". linkAgeMs() drives both the INPUT stat tile and the top banner.

     TWO CSS RULES ARE LOAD-BEARING, not cosmetic - see the comments at each:
       touch-action:none on .btn, and user-scalable=no on the viewport below.
     =========================================================================== -->

<!-- user-scalable=no and maximum-scale=1 stop a double-tap on a control button from zooming
     the page mid-flight, which would otherwise move every other button out from under the
     pilot's thumb. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TinyWhoop Control</title>
<style>
/* Everything is inline - no CDN, no external fonts, no external anything. The drone's AP has
   no internet connection, so any external reference would simply hang. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:8px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:#0b1220;color:#e6edf7;font-size:14px;overscroll-behavior:none}
h1{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* --- Status bar --- */
#status{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin-bottom:10px}
.stat{background:#151f33;border:1px solid #25314a;border-radius:8px;padding:6px 8px}
.stat .k{font-size:10px;color:#8fa3c0;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
/* A value the firmware does not actually measure, or one we know is stale, is dimmed rather
   than hidden - a confident-looking number that is not a measurement is worse than no number. */
.stat .v.dim{color:#8fa3c0}
.stat .v.good{color:#7ee2a8}
.stat .v.warn{color:#f0c674}
.stat .v.bad{color:#ff9aa2}

/* --- Banner --- */
#banner{padding:8px;border-radius:8px;margin-bottom:10px;font-weight:600;text-align:center}
.ok{background:#12341f;border:1px solid #2c7a4b;color:#7ee2a8}
.warn{background:#3a2a10;border:1px solid #8a6420;color:#f0c674}
.bad{background:#3a1418;border:1px solid #8a2b33;color:#ff9aa2}

/* --- Control buttons ---
   touch-action:none is essential: without it the browser treats a press-and-drag on a button
   as a scroll gesture, swallows the pointer events, and the button never reports release. */
.btn{touch-action:none;user-select:none;background:#1b2740;border:1px solid #2e3d5c;color:#e6edf7;
     border-radius:10px;padding:16px 0;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.btn.held{background:#2563eb;border-color:#3b82f6}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pad .sp{visibility:hidden}

/* --- Pitch/roll joystick ---
   touch-action:none is load-bearing, not cosmetic: without it the browser claims the drag as a
   page scroll or a pull-to-refresh, the pointer events stop arriving mid-flight, and the stick
   silently latches at wherever it was when the gesture was stolen. */
.stickwrap{display:flex;justify-content:center}
.stick{position:relative;width:min(70vw,260px);height:min(70vw,260px);
       background:#0c1526;border:1px solid #1e2b45;border-radius:50%;
       touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stick.active{cursor:grabbing;border-color:#3b82f6}
/* Inner ring marks full deflection - the knob centre stops here. */
.stick-ring{position:absolute;inset:12%;border:1px dashed #24344f;border-radius:50%;
            pointer-events:none}
.stick-cross-h{position:absolute;left:8%;right:8%;top:50%;height:1px;background:#1a2740;
               pointer-events:none}
.stick-cross-v{position:absolute;top:8%;bottom:8%;left:50%;width:1px;background:#1a2740;
               pointer-events:none}
.stick-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
            background:#2563eb;border:2px solid #60a5fa;border-radius:50%;
            box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none;
            transition:background .12s ease}
.stick.active .stick-knob{background:#3b82f6}
.group{background:#101a2e;border:1px solid #1e2b45;border-radius:12px;padding:10px;margin-bottom:10px}
.group h2{font-size:12px;color:#8fa3c0;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.half{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.third{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* --- Action buttons (tap, not hold) --- */
.act{background:#1b2740;border:1px solid #2e3d5c;color:#e6edf7;border-radius:10px;padding:14px 0;
     font-size:14px;font-weight:700;cursor:pointer;width:100%}
.act.arm{background:#14532d;border-color:#22c55e}
.act.disarm{background:#374151;border-color:#6b7280}
.act.kill{background:#7f1d1d;border-color:#ef4444}
.act.on{background:#2563eb;border-color:#3b82f6}
.act.shot{background:#4c1d95;border-color:#8b5cf6}

/* --- Collapsible tuning --- */
details{background:#101a2e;border:1px solid #1e2b45;border-radius:12px;padding:8px}
summary{cursor:pointer;font-size:12px;color:#8fa3c0;text-transform:uppercase;letter-spacing:.08em;padding:4px}
.gain{display:grid;grid-template-columns:1fr repeat(3,minmax(0,1fr)) auto;gap:4px;align-items:center;margin-top:6px}
.gain label{font-size:11px;color:#a9bcd8}
.gain input{width:100%;background:#0b1220;border:1px solid #2e3d5c;color:#e6edf7;border-radius:6px;
            padding:6px;font-size:12px;font-variant-numeric:tabular-nums}
.gain button{background:#1e3a8a;border:1px solid #3b82f6;color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer}
</style>
</head>
<body>

<h1>TinyWhoop Control</h1>
<div id="banner" class="bad">Connecting...</div>

<div id="status">
  <div class="stat"><div class="k">Armed</div><div class="v" id="s_armed">-</div></div>
  <div class="stat"><div class="k">Mode</div><div class="v" id="s_mode">-</div></div>
  <div class="stat"><div class="k">Roll</div><div class="v" id="s_roll">-</div></div>
  <div class="stat"><div class="k">Pitch</div><div class="v" id="s_pitch">-</div></div>
  <div class="stat"><div class="k">Yaw</div><div class="v" id="s_yaw">-</div></div>
  <div class="stat"><div class="k">Alt</div><div class="v" id="s_alt">-</div></div>
  <!-- Body-frame velocity from the optical flow sensor. The backend has always sent vx/vy and
       vel_valid in /api/status; nothing rendered them, so position hold could be engaged with
       no way to see whether the estimate was sane. These two tiles are that view.
       Vel X = forward, Vel Y = right. Both read n/a whenever vel_valid is false, exactly like
       Alt does - a stale number here is far worse than no number, because it is the input the
       velocity loop steers on. -->
  <div class="stat"><div class="k">Vel X (fwd)</div><div class="v" id="s_vx">-</div></div>
  <div class="stat"><div class="k">Vel Y (right)</div><div class="v" id="s_vy">-</div></div>
  <!-- The flight controller has no ADC divider on the pack: flight_control.c reports a fixed
       nominal 3.8 V. Labelled and dimmed so it can never be mistaken for a real gauge. -->
  <div class="stat"><div class="k">Batt (nom)</div><div class="v dim" id="s_batt">-</div></div>
  <div class="stat"><div class="k">Input link</div><div class="v" id="s_input">-</div></div>
  <div class="stat"><div class="k">Loop Hz</div><div class="v" id="s_hz">-</div></div>
  <div class="stat"><div class="k">Photos</div><div class="v" id="s_shots">-</div></div>
</div>

<!-- Pitch / roll joystick.
     Replaced the four-button pad on 2026-08-29. Buttons made a proportional quantity into a
     timing problem: to command 6 deg you had to hold for some number of milliseconds, by feel,
     while watching a drifting drone. Thumb position is the angle now. -->
<div class="group">
  <h2>Pitch / Roll</h2>
  <div class="stickwrap">
    <div class="stick" id="stick">
      <div class="stick-ring"></div>
      <div class="stick-cross-h"></div>
      <div class="stick-cross-v"></div>
      <div class="stick-knob" id="stickKnob"></div>
    </div>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:8px">
    <span style="font-size:12px;color:#8fa3c0">Stick&nbsp;&nbsp;<span id="s_stick"
      style="font-variant-numeric:tabular-nums;color:#e6edf7;font-weight:600">0.00, 0.00</span></span>
    <span style="font-size:12px;color:#8fa3c0">Cmd&nbsp;&nbsp;<span id="s_cmd"
      style="font-variant-numeric:tabular-nums;color:#e6edf7;font-weight:600">0.0°, 0.0°</span></span>
  </div>
</div>

<!-- Altitude and yaw -->
<div class="group">
  <h2>Altitude (trim) / Yaw</h2>
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <span style="font-size:12px;color:#8fa3c0">Throttle trim</span>
    <span id="s_trim" style="font-variant-numeric:tabular-nums;font-weight:600">-</span>
  </div>
  <div class="half" style="margin-bottom:6px">
    <div class="btn" data-btn="throttle_up">ALT +</div>
    <div class="btn" data-btn="throttle_down">ALT &minus;</div>
  </div>
  <div class="half">
    <div class="btn" data-btn="yaw_left">YAW &#8592;</div>
    <div class="btn" data-btn="yaw_right">YAW &#8594;</div>
  </div>
</div>

<!-- Arming and actions -->
<div class="group">
  <h2>Arming</h2>
  <div class="third" style="margin-bottom:6px">
    <button class="act arm" id="b_arm">ARM</button>
    <button class="act disarm" id="b_disarm">DISARM</button>
    <button class="act kill" id="b_kill">KILL</button>
  </div>
  <div class="half">
    <button class="act" id="b_hold">HOLD: OFF</button>
    <button class="act shot" id="b_shot">SHOT</button>
  </div>
  <div class="half">
    <button class="act" id="b_preview">PREVIEW: OFF</button>
  </div>
</div>

<!-- Viewfinder. Hidden until preview is switched on; the radio is the most expensive thing
     on this board and streaming is the only thing that makes it transmit continuously. -->
<div id="previewPanel" style="display:none">
  <img id="previewImg" alt="viewfinder"
       style="width:100%;border-radius:8px;background:#111;display:block">
  <div class="muted" id="previewInfo" style="text-align:center">starting...</div>
</div>

<!-- Collapsible PID tuning -->
<details>
  <summary>PID tuning</summary>
  <div id="gains"></div>
</details>

<script>
// ---------------------------------------------------------------------------
// Button state. Every held button is tracked here and the whole object is posted at a fixed
// 20 Hz, rather than sending an event per press. Fixed-rate posting is what lets the drone
// detect that the browser has gone away: no posts means no pilot.
// ---------------------------------------------------------------------------
var held = {
  pitch_forward:false, pitch_back:false,
  roll_left:false, roll_right:false,
  yaw_left:false, yaw_right:false,
  throttle_up:false, throttle_down:false
};

var armed = false, hold = false;

// --- Press and hold wiring -------------------------------------------------
function bindHold(el) {
  var name = el.getAttribute('data-btn');

  function press(e) {
    e.preventDefault();
    held[name] = true;
    el.classList.add('held');
    // Capture the pointer so we keep getting events even if the finger slides off the button.
    if (el.setPointerCapture && e.pointerId !== undefined) {
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    // Don't wait for the next 20 Hz tick. The fixed-rate POST is what the firmware's watchdog
    // needs, but on its own it adds up to 50 ms of dead time between the thumb going down and
    // the board hearing about it - on top of the link round trip. Posting the edge immediately
    // removes that, and sendInput() is already non-overlapping, so this can only ever replace a
    // tick that was about to fire, never stack another request on top of one in flight.
    sendInput();
  }

  function release(e) {
    if (e) e.preventDefault();
    held[name] = false;
    el.classList.remove('held');
    // Same on the way up: the sooner the board sees the release, the sooner the axis decays.
    sendInput();
  }

  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  // pointercancel fires when the OS steals the gesture (a notification, a call). Without
  // handling it the button would latch on and the drone would keep flying in that direction.
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

var padButtons = document.querySelectorAll('[data-btn]');
for (var i = 0; i < padButtons.length; i++) bindHold(padButtons[i]);

// --- Pitch / roll joystick -------------------------------------------------
// Sends normalised displacement as jx/jy on every /api/input POST. The firmware owns the feel:
// the expo curve, the 10 deg limit and the slew limit all live in control_state.c, so this is
// deliberately a dumb input device that reports where the thumb is and nothing more.
//
// jx +1 = full right, jy +1 = full forward. Screen Y grows downwards, so the vertical axis is
// negated below - up on the screen must mean forward.
var stick = {x:0, y:0};

(function() {
  var pad = document.getElementById('stick');
  var knob = document.getElementById('stickKnob');
  var readout = document.getElementById('s_stick');
  var cmdOut = document.getElementById('s_cmd');
  var activeId = null;

  // Must match ROLL_PITCH_EXPO / MAX_ROLL_PITCH_DEG in control_state.c. Only used to show the
  // pilot what the firmware will do with the stick - nothing is transmitted from here.
  var EXPO = 0.60, MAX_DEG = 10.0;
  function expo(v) { return ((1 - EXPO) * v) + (EXPO * v * v * v); }

  function render() {
    var r = pad.clientWidth / 2;
    // 0.88 keeps the knob centre on the dashed ring at full deflection rather than hanging
    // off the edge of the circle.
    knob.style.transform = 'translate(' + (stick.x * r * 0.88) + 'px,' +
                                          (-stick.y * r * 0.88) + 'px)';
    readout.textContent = stick.x.toFixed(2) + ', ' + stick.y.toFixed(2);
    cmdOut.textContent = (expo(stick.x) * MAX_DEG).toFixed(1) + '°, ' +
                         (expo(stick.y) * MAX_DEG).toFixed(1) + '°';
  }

  function setFromEvent(e) {
    var box = pad.getBoundingClientRect();
    var r = box.width / 2;
    var x = (e.clientX - (box.left + r)) / r;
    var y = -(e.clientY - (box.top + r)) / r;   // screen Y is inverted

    // Clamp to the unit disc, matching control_state_set_stick(). Clamping each axis to
    // [-1,1] independently would let a corner drag command 1.41x tilt on the diagonal.
    var m = Math.sqrt(x * x + y * y);
    if (m > 1) { x /= m; y /= m; }

    stick.x = x;
    stick.y = y;
    render();
  }

  function centre() {
    stick.x = 0;
    stick.y = 0;
    render();
  }

  pad.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    activeId = e.pointerId;
    pad.classList.add('active');
    // Capture so the drag keeps tracking when the thumb leaves the circle - without this the
    // stick would freeze at the edge mid-correction, which is the worst possible moment.
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    setFromEvent(e);
    sendInput();          // don't wait up to 50 ms for the next tick
  });

  pad.addEventListener('pointermove', function(e) {
    if (activeId === null || e.pointerId !== activeId) return;
    e.preventDefault();
    setFromEvent(e);
    // No POST here on purpose. The 20 Hz timer already carries the current position, and a
    // move handler can fire at 120 Hz+ - posting per event would flood a link that is also
    // carrying telemetry, and sendInput() would drop most of them anyway.
  });

  function endDrag(e) {
    if (activeId === null || (e && e.pointerId !== activeId)) return;
    if (e) e.preventDefault();
    activeId = null;
    pad.classList.remove('active');
    centre();
    sendInput();          // release the drone promptly
  }

  pad.addEventListener('pointerup', endDrag);
  // pointercancel fires when the OS steals the gesture - a notification, an incoming call.
  // Without it the stick latches at its last position and the drone flies away.
  pad.addEventListener('pointercancel', endDrag);
  pad.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // Exposed so releaseAll() can centre the stick along with the buttons.
  window.__stickCentre = function() { activeId = null; pad.classList.remove('active'); centre(); };

  render();
})();

// --- Release everything --------------------------------------------------
// Called whenever the page loses focus. If the pilot switches apps or the phone locks, every
// button must come up: the alternative is a drone that keeps flying in whatever direction was
// last pressed. The firmware has its own 500 ms timeout as a backstop, but releasing here is
// immediate and does not depend on the network still working.
function releaseAll() {
  for (var k in held) held[k] = false;
  var els = document.querySelectorAll('.btn.held');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('held');
  // The stick counts as a directional input too - leaving it deflected while the tab is hidden
  // would keep the drone banked until the firmware's own 500 ms timeout caught it.
  if (window.__stickCentre) window.__stickCentre();
}

// --- Screen wake lock ------------------------------------------------------
// Held for as long as the page is visible. See the header comment: a screen that blanks on its
// own idle timer takes the drone down via releaseAll() and the 3 s disarm timeout.
//
// The lock is requested, never awaited by anything else, and every failure path is a no-op:
// unsupported browser, insecure context, denied by the user, or the OS revoking it. The page
// must fly exactly the same with no lock - this only removes a way to lose the drone, it is
// never something the control path depends on.
var wakeLock = null;

function acquireWakeLock() {
  if (!navigator.wakeLock || wakeLock || document.hidden) return;
  navigator.wakeLock.request('screen').then(function(lock) {
    wakeLock = lock;
    // Fires when the browser drops it - hiding the tab, or the OS reclaiming it. Clearing the
    // handle here is what lets the visibilitychange path below take a fresh one.
    lock.addEventListener('release', function() { wakeLock = null; });
  }).catch(function() { /* not supported, insecure context, or refused - fly without it */ });
}

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) acquireWakeLock();
});
acquireWakeLock();

// --- Viewfinder ------------------------------------------------------------
// OFF by default and stopped whenever the tab is not visible. Frames are requested one at a
// time: the next request goes out only after the previous image resolves, so if the link
// slows down the preview degrades on its own instead of queueing up behind the control POSTs.
var previewOn = false;
var previewBusy = false;
var previewFrames = 0;
var previewImg = document.getElementById('previewImg');
var previewPanel = document.getElementById('previewPanel');
var previewInfo = document.getElementById('previewInfo');

function previewTick() {
  if (!previewOn || previewBusy || document.hidden) return;
  previewBusy = true;
  var probe = new Image();
  probe.onload = function() {
    previewImg.src = probe.src;
    previewBusy = false;
    previewFrames++;
    previewInfo.textContent = previewFrames + ' frames';
  };
  probe.onerror = function() {
    previewBusy = false;      // usually just "no frame yet" right after switching on
  };
  probe.src = '/preview.jpg?n=' + Date.now();
}
setInterval(previewTick, 120);   // ~8 fps ceiling; actual rate follows the link

function setPreview(on) {
  previewOn = on;
  previewPanel.style.display = on ? 'block' : 'none';
  var button = document.getElementById('b_preview');
  button.textContent = 'PREVIEW: ' + (on ? 'ON' : 'OFF');
  button.className = on ? 'act on' : 'act';
  if (!on) { previewFrames = 0; previewInfo.textContent = 'starting...'; }
  post('/api/preview', { enable: on });
}

document.getElementById('b_preview').addEventListener('click', function() {
  setPreview(!previewOn);
});

// Stop previewing whenever the tab goes away. Same reasoning as releasing the sticks: if you
// are not looking at it, it must not keep the radio transmitting.
function stopPreviewIfHidden() {
  if (previewOn) setPreview(false);
}
window.addEventListener('blur', stopPreviewIfHidden);
window.addEventListener('pagehide', stopPreviewIfHidden);
document.addEventListener('visibilitychange', function() {
  if (document.hidden) stopPreviewIfHidden();
});

window.addEventListener('blur', releaseAll);
window.addEventListener('pagehide', releaseAll);
document.addEventListener('visibilitychange', function() {
  if (document.hidden) releaseAll();
});

// --- Fixed 20 Hz input POST ------------------------------------------------
// One POST at a time, and never more than INPUT_TIMEOUT_MS in flight.
//
// The old version fired every 50 ms regardless of whether the previous fetch had resolved. The
// server handles requests serially on a single task, so on a weak link the outstanding POSTs
// queue up behind each other and every one of them carries button state that is already stale
// by the time it is read. Skipping a tick is strictly better: the firmware integrates setpoints
// on its own 50 Hz clock and tolerates 500 ms of silence before releasing the axes.
//
// A POST still open after INPUT_TIMEOUT_MS is aborted rather than waited on, so one stuck
// request cannot hold the slot shut forever.
//
// 500 ms is deliberate and matches control_state's INPUT_TIMEOUT_US. Past that point the
// firmware has ALREADY started decaying the axes to neutral, so the frame genuinely has nothing
// left to deliver. Anything shorter throws away frames that are merely late: a link with a
// 300 ms round trip is degraded but perfectly flyable, and aborting at 250 ms would mean not one
// control frame ever landed on it - the drone would decay and then disarm on a link that was
// still working. Late frames beat no frames.
var INPUT_TIMEOUT_MS = 500;

var inputBusy = false;
var lastInputOkMs = 0;      // performance.now() of the last POST the server accepted
var inputEverOk = false;
var pageLoadMs = performance.now();

function sendInput() {
  if (inputBusy) return;    // previous POST still outstanding - drop this tick
  inputBusy = true;

  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var killer = ctrl ? setTimeout(function(){ ctrl.abort(); }, INPUT_TIMEOUT_MS) : 0;

  // Buttons plus the joystick in one frame. jx/jy ride along with the held flags so there is
  // still exactly one control POST per tick and one browser watchdog to satisfy.
  var frame = {jx: stick.x, jy: stick.y};
  for (var k in held) frame[k] = held[k];

  var opts = {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(frame)
  };
  if (ctrl) opts.signal = ctrl.signal;

  fetch('/api/input', opts).then(function(r) {
    // A 4xx/5xx still means the round trip completed, but it is not an accepted control frame.
    if (r.ok) { lastInputOkMs = performance.now(); inputEverOk = true; }
  }).catch(function() {
    // Network error or our own abort. Either way: no accepted frame, so leave lastInputOkMs
    // alone and let it age. linkAgeMs() is what turns that age into something the pilot sees.
  }).then(function() {
    if (killer) clearTimeout(killer);
    inputBusy = false;
  });
}
setInterval(sendInput, 50);   // 20 Hz

// Age of the last accepted control frame, in ms. -1 before the first one ever lands.
function inputAgeMs() {
  return inputEverOk ? (performance.now() - lastInputOkMs) : -1;
}

// --- Action buttons --------------------------------------------------------
function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  });
}

document.getElementById('b_arm').addEventListener('click', function() {
  armed = true;
  post('/api/arm', {armed: true});
});

document.getElementById('b_disarm').addEventListener('click', function() {
  armed = false;
  releaseAll();
  post('/api/arm', {armed: false});
});

document.getElementById('b_kill').addEventListener('click', function() {
  armed = false;
  releaseAll();
  post('/api/arm', {kill: true});
});

document.getElementById('b_hold').addEventListener('click', function() {
  hold = !hold;
  var b = document.getElementById('b_hold');
  b.textContent = 'HOLD: ' + (hold ? 'ON' : 'OFF');
  b.className = 'act' + (hold ? ' on' : '');
  post('/api/mode', {hold: hold, mode: hold ? 2 : 0});
});

document.getElementById('b_shot').addEventListener('click', function() {
  // Returns immediately - the firmware queues the shot and writes it on another core.
  post('/api/capture', {});
});

// --- PID tuning ------------------------------------------------------------
// Loop ids must match telemetry_loop_id_t in telemetry_uart.h.
var LOOPS = [
  [0, 'Rate roll'], [1, 'Rate pitch'], [2, 'Rate yaw'],
  [3, 'Angle roll'], [4, 'Angle pitch'],
  [5, 'Vel X'], [6, 'Vel Y'], [7, 'Altitude']
];

var gainsHost = document.getElementById('gains');
for (var g = 0; g < LOOPS.length; g++) {
  (function(id, name) {
    var row = document.createElement('div');
    row.className = 'gain';
    row.innerHTML =
      '<label>' + name + '</label>' +
      '<input type="number" step="any" placeholder="kp" id="kp' + id + '">' +
      '<input type="number" step="any" placeholder="ki" id="ki' + id + '">' +
      '<input type="number" step="any" placeholder="kd" id="kd' + id + '">' +
      '<button id="gs' + id + '">SET</button>';
    gainsHost.appendChild(row);

    document.getElementById('gs' + id).addEventListener('click', function() {
      var kp = parseFloat(document.getElementById('kp' + id).value);
      var ki = parseFloat(document.getElementById('ki' + id).value);
      var kd = parseFloat(document.getElementById('kd' + id).value);
      if (isNaN(kp) || isNaN(ki) || isNaN(kd)) {
        alert('Enter all three gains for ' + name);
        return;
      }
      post('/api/gains', {loop: id, kp: kp, ki: ki, kd: kd});
    });
  })(LOOPS[g][0], LOOPS[g][1]);
}

// --- Telemetry readback ----------------------------------------------------
var MODES = ['ANGLE', 'ALT HOLD', 'POS HOLD'];

function setText(id, text) { document.getElementById(id).textContent = text; }

function refresh() {
  fetch('/api/status').then(function(r){ return r.json(); }).then(function(d) {
    var banner = document.getElementById('banner');

    // The INPUT tile, and its thresholds. 250 ms is five missed ticks - noticeable but flyable.
    // 500 ms is control_state's INPUT_TIMEOUT_US: past that the firmware has already begun
    // decaying the axes to neutral, so it is a real loss of control, not a slow link.
    // The first status poll fires before the first input POST can possibly have landed, so a
    // short grace window after load reads as "starting", not as a lost link. Without it the
    // page alarms at itself for the first fraction of a second every time it is opened.
    var age = inputAgeMs();
    var starting = (age < 0) && ((performance.now() - pageLoadMs) < 1000);
    var inputDown = !starting && ((age < 0) || (age >= 500));
    var inputEl = document.getElementById('s_input');
    if (starting) {
      inputEl.textContent = 'starting'; inputEl.className = 'v dim';
    } else if (age < 0) {
      inputEl.textContent = 'no input'; inputEl.className = 'v bad';
    } else if (age >= 500) {
      inputEl.textContent = 'LOST';     inputEl.className = 'v bad';
    } else if (age >= 250) {
      inputEl.textContent = 'lagging';  inputEl.className = 'v warn';
    } else {
      inputEl.textContent = 'ok';       inputEl.className = 'v good';
    }

    // Input comes first in the banner: /api/status arriving proves the board is reachable, but
    // it is /api/input that flies the drone, and the two can fail independently.
    if (inputDown) {
      banner.className = 'bad';
      banner.textContent = 'CONTROL INPUT NOT REACHING THE DRONE';
    } else if (!d.link) {
      banner.className = 'bad';
      banner.textContent = 'NO LINK TO FLIGHT CONTROLLER';
    } else if (!d.fc_rx) {
      // Status is arriving but the flight controller says it is NOT receiving our control
      // frames. The two directions are separate wires, so this is a one-way link - and since
      // the same UART task is successfully receiving in the other direction, it is the
      // module -> FC wire, physically. A broken one of these cost a flight on 2026-08-29:
      // telemetry looked perfectly healthy the whole time.
      banner.className = 'bad';
      banner.textContent = 'ONE-WAY LINK - FC not receiving control (check UART TX wire)';
    } else if (d.killed) {
      banner.className = 'bad';
      // Spell out the escape. The latch clears only when kill is released AND arm is NOT being
      // requested, so pressing ARM to recover is exactly what keeps it latched - the instinctive
      // reaction is the one that does not work.
      banner.textContent = 'KILLED - press DISARM to clear (ARM will not)';
    } else if (armed && !d.armed) {
      // We are asking to arm and the flight controller is refusing. It refuses silently, in four
      // different places, so without this the banner cheerfully said "Ready to arm" while nothing
      // happened. Everything needed to name the reason is already in /api/status.
      banner.className = 'bad';
      if (!d.attitude_init) {
        banner.textContent = 'WILL NOT ARM - attitude still initialising, hold still';
      } else if (d.throttle_trim >= 0.02) {
        banner.textContent = 'WILL NOT ARM - lower ALT trim to 0 (now ' +
                             Math.round(d.throttle_trim * 100) + '%)';
      } else {
        banner.textContent = 'WILL NOT ARM - flight controller refusing';
      }
    } else if (d.armed) {
      banner.className = 'warn';
      banner.textContent = 'ARMED - MOTORS LIVE';
    } else if (!d.attitude_init) {
      banner.className = 'warn';
      banner.textContent = 'Attitude initialising, hold still';
    } else {
      banner.className = 'ok';
      banner.textContent = 'Ready to arm';
    }

    setText('s_armed', d.armed ? 'YES' : 'no');
    setText('s_mode', MODES[d.mode] || d.mode);
    setText('s_roll', d.roll.toFixed(1) + '°');
    setText('s_pitch', d.pitch.toFixed(1) + '°');
    setText('s_yaw', d.yaw.toFixed(1) + '°');
    setText('s_alt', d.alt_valid ? d.altitude.toFixed(2) + ' m' : 'n/a');

    // Optical flow velocity. Gated on vel_valid for the same reason Alt is gated on alt_valid:
    // when the estimate is not trustworthy the honest display is "n/a", not the last good value
    // frozen on screen looking healthy.
    //
    // The Mode tile above tells you whether the velocity loop is RUNNING (the flight controller
    // now reports the mode actually in effect, not the one requested); these two tell you what
    // it would be running ON. Watch them before pressing HOLD - if they are not near zero with
    // the drone sitting still, do not engage.
    setText('s_vx', d.vel_valid ? d.vx.toFixed(2) + ' m/s' : 'n/a');
    setText('s_vy', d.vel_valid ? d.vy.toFixed(2) + ' m/s' : 'n/a');

    // Nominal, not measured - see the tile's comment above and flight_control.c.
    setText('s_batt', d.battery.toFixed(2) + ' V');
    setText('s_trim', Math.round(d.throttle_trim * 100) + '%');
    setText('s_hz', d.loop_hz);
    setText('s_shots', d.shots_written + '/' + d.shots_requested +
                       (d.shots_failed ? ' (' + d.shots_failed + ' fail)' : ''));
  }).catch(function() {
    var banner = document.getElementById('banner');
    banner.className = 'bad';
    banner.textContent = 'DASHBOARD DISCONNECTED';
  });
}
setInterval(refresh, 200);   // 5 Hz
refresh();
</script>
</body>
</html>
